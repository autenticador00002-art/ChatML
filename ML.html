<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atendimento - Clique e fale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{display:flex;flex-direction:column;height:100vh;background:#f5f5f5}
header{height:56px;background:#3483fa;color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:600}
#messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column}
.msg{max-width:70%;margin-bottom:6px;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.4}
.msg.me{align-self:flex-end;background:#dcf8c6}
.msg.you{align-self:flex-start;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
time{display:block;font-size:10px;color:#999;margin-top:4px;text-align:right}
#footer{display:flex;background:#fff;border-top:1px solid #ddd;padding:6px}
#footer input{flex:1;border:none;outline:none;padding:10px;font-size:16px}
#footer button{background:#3483fa;color:#fff;border:none;padding:10px 16px;border-radius:50%;font-size:18px}
</style>
</head>
<body>
<header>Atendimento Online</header>
<section id="messages"></section>
<form id="footer">
  <input id="txt" placeholder="Digite sua dúvida…" required>
  <button>▶</button>
</form>
<script>
const box = document.getElementById('messages');
const form = document.forms[0];
const txt  = document.getElementById('txt');
form.onsubmit = e => {
  e.preventDefault();
  const m = txt.value.trim();
  if(!m)return;
  addMsg(m,true);
  txt.value='';
  setTimeout(()=>addMsg('Recebemos sua mensagem! Em breve respondemos.',false),700);
};
function addMsg(text,me){
  const t = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  box.insertAdjacentHTML('beforeend',
    `<div class="msg ${me?'me':'you'}">${text}<time>${t}</time></div>`);
  box.scrollTop = box.scrollHeight;
}
addMsg('Olá! Qual sua dúvida?',false);
</script>
</body>
</html>
